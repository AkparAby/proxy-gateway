<h1>Proxy Gateway</h1>
<p>适用于 Apple 芯片 Mac（macOS 12 或更新版本）。将应用安装到“应用程序”文件夹，内含代理内核，无需安装 Go。</p>
<p>升级前请在已有网关中选择“恢复接入并退出”。本安装程序保留用户目录中的出口配置和日志，不会自动开启系统代理或登录自启动。</p>
<p>项目源码采用 MIT 许可证；独立 Mihomo 内核采用 GPL-3.0，完整许可证位于应用资源目录，对应源码随 GitHub Release 提供。</p>
</body></html>
