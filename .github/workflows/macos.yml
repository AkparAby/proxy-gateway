name: macOS Apple Silicon
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (vX.Y.Z)
        required: true
        default: v0.4.0
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version || 'v0.0.0-dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify native architecture and source
        run: |
          test "$(uname -m)" = arm64
          go test -race ./...
          go vet ./...
          CGO_ENABLED=0 go test -tags desktop,ci ./internal/desktop ./cmd/desktop
      - name: Package Apple Silicon app
        run: go run scripts/package-macos.go -version "$RELEASE_VERSION"
      - name: Test extracted app and real proxy failover
        run: node scripts/smoke-macos.mjs "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: |
            dist/${{ env.RELEASE_VERSION }}/*.zip
            dist/${{ env.RELEASE_VERSION }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-desktop-test-image
          path: runtime/mac-desktop-smoke.png
          if-no-files-found: ignore
          retention-days: 7
